plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.0.1'
}

group = 'com.priolab'
version = '2.0.0'

ext {
    javafxVersion = '21.0.4'
    jacksonVersion = '2.18.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
}

application {
    mainModule = 'com.priolab'
    mainClass = 'com.priolab.App'
}

// Record the project version in module-info, which jlink and jpackage carry
// into the runtime image; App.version() reads it back for the About dialog, so
// the version lives in exactly one place: the 'version' property above.
tasks.named('compileJava') {
    options.javaModuleVersion = provider { project.version.toString() }
}

// ---------------------------------------------------------------------------
// jlink / jpackage: produces a self-contained runtime image and native
// installers. On Linux this builds a .deb; on Windows a .msi.
// Build here on Linux with:  ./gradlew jpackage
// ---------------------------------------------------------------------------
jlink {
    imageZip = layout.buildDirectory.file("distributions/priolab-${javafx.platform.classifier}.zip")
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']

    launcher {
        name = 'priolab'
    }

    jpackage {
        imageName = 'priolab'
        def currentOs = org.gradle.internal.os.OperatingSystem.current()
        // jpackage only accepts the host's icon format -- .ico on Windows,
        // .png on Linux. Handing it the wrong one is just a warning, and the
        // bundle then silently keeps the default Java icon.
        icon = currentOs.windows
                ? 'packaging/windows/priolab.ico'
                : 'src/main/resources/com/priolab/img/priolab.png'
        if (currentOs.windows) {
            installerType = 'msi'
            installerOptions = ['--win-dir-chooser', '--win-menu', '--win-shortcut', '--win-per-user-install']
        } else if (currentOs.linux) {
            installerType = 'deb'
            installerOptions = ['--linux-shortcut', '--linux-menu-group', 'Utility']
        }
        installerName = 'priolab'
    }
}

// ---------------------------------------------------------------------------
// AppImage: one double-clickable file, no installation. The user only has to
// set the executable bit (chmod +x) and run it.
//   ./gradlew appimage
//     -> build/distributions/PrioLab-<version>-x86_64.AppImage
//
// It wraps the very same self-contained jpackage app image (app + JRE) used by
// the .deb, so end users still don't need Java installed.
// Set APPIMAGETOOL=/path/to/appimagetool to build offline with a local copy.
// ---------------------------------------------------------------------------
ext {
    appImageArch = 'x86_64'
    appImageToolUrl = "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${appImageArch}.AppImage"
}

def appImageToolCache = layout.buildDirectory.file("tools/appimagetool-${appImageArch}.AppImage")

tasks.register('fetchAppImageTool') {
    group = 'distribution'
    description = 'Downloads appimagetool into build/tools (skipped when $APPIMAGETOOL is set).'
    outputs.file(appImageToolCache)
    outputs.upToDateWhen { System.getenv('APPIMAGETOOL') == null && appImageToolCache.get().asFile.exists() }
    doLast {
        def local = System.getenv('APPIMAGETOOL')
        def target = appImageToolCache.get().asFile
        target.parentFile.mkdirs()
        if (local) {
            copy { from local; into target.parentFile; rename { target.name } }
        } else {
            logger.lifecycle("Downloading ${appImageToolUrl}")
            new java.net.URL(appImageToolUrl).withInputStream { input ->
                target.withOutputStream { output -> output << input }
            }
        }
        target.setExecutable(true)
    }
}

tasks.register('appDir', Copy) {
    group = 'distribution'
    description = 'Assembles build/AppDir from the jpackage app image.'
    dependsOn tasks.named('jpackageImage')

    def appImage = layout.buildDirectory.dir("jpackage/priolab")
    def appDirOut = layout.buildDirectory.dir('AppDir')
    def appIcon = file('src/main/resources/com/priolab/img/priolab.png')
    inputs.dir(appImage)
    into appDirOut

    // The jlink runtime ships read-only legal files, which cannot be copied
    // over in place -- start from a clean AppDir every time.
    doFirst { delete(appDirOut) }

    // app + bundled JRE
    from(appImage) { into 'usr' }
    // AppImage entry point and the desktop entry / icon appimagetool looks for
    from('packaging/appimage') {
        include 'AppRun'
        filePermissions { unix(0755) }
    }
    from('packaging/appimage') { include 'priolab.desktop' }
    from('packaging/appimage') { include 'priolab.desktop'; into 'usr/share/applications' }
    // the icon lives with the app resources (the JavaFX stage uses it too)
    from(appIcon)
    from(appIcon) { into 'usr/share/icons/hicolor/256x256/apps' }

    doLast {
        // .DirIcon is the thumbnail file managers show for the AppImage
        def dir = destinationDir.toPath()
        java.nio.file.Files.deleteIfExists(dir.resolve('.DirIcon'))
        java.nio.file.Files.createSymbolicLink(dir.resolve('.DirIcon'), java.nio.file.Paths.get('priolab.png'))
    }
}

tasks.register('appimage', Exec) {
    group = 'distribution'
    description = 'Builds a portable, no-install AppImage of PrioLab.'
    dependsOn 'appDir', 'fetchAppImageTool'

    def appDirPath = layout.buildDirectory.dir('AppDir')
    def output = layout.buildDirectory.file("distributions/PrioLab-${version}-${appImageArch}.AppImage")
    inputs.dir(appDirPath)
    outputs.file(output)

    doFirst { output.get().asFile.parentFile.mkdirs() }
    environment 'ARCH', appImageArch
    commandLine appImageToolCache.get().asFile.absolutePath,
            '--appimage-extract-and-run', // works on hosts without FUSE installed
            '--no-appstream',
            appDirPath.get().asFile.absolutePath,
            output.get().asFile.absolutePath

    doLast { logger.lifecycle("AppImage: ${output.get().asFile}") }
}
