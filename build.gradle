plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.0.1'
}

group = 'com.priolab'
version = '1.0.0'

ext {
    javafxVersion = '21.0.4'
    jacksonVersion = '2.18.2'
    sqliteVersion = '3.46.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "org.xerial:sqlite-jdbc:${sqliteVersion}"
}

application {
    mainModule = 'com.priolab'
    mainClass = 'com.priolab.App'
}

// ---------------------------------------------------------------------------
// jlink / jpackage: produces a self-contained runtime image and native
// installers. On Linux this builds a .deb; on Windows a .msi.
// Build here on Linux with:  ./gradlew jpackage
// ---------------------------------------------------------------------------
jlink {
    imageZip = layout.buildDirectory.file("distributions/priolab-${javafx.platform.classifier}.zip")
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']

    // sqlite-jdbc is a non-modular (automatic) jar; merge it into the app image.
    forceMerge('sqlite-jdbc')
    mergedModule {
        requires 'java.sql'
        requires 'java.naming'
    }

    launcher {
        name = 'priolab'
    }

    jpackage {
        imageName = 'priolab'
        def currentOs = org.gradle.internal.os.OperatingSystem.current()
        if (currentOs.windows) {
            installerType = 'msi'
            installerOptions = ['--win-dir-chooser', '--win-menu', '--win-shortcut', '--win-per-user-install']
        } else if (currentOs.linux) {
            installerType = 'deb'
            installerOptions = ['--linux-shortcut', '--linux-menu-group', 'Utility']
        }
        installerName = 'priolab'
    }
}
